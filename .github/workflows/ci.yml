name: 🚀 Noctwave CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: 🔍 Analyze & Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 📚 Checkout
        uses: actions/checkout@v4

      - name: 🐦 Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 📦 Pub get
        run: flutter pub get

      - name: 🔍 Analyze
        run: flutter analyze --fatal-infos

      - name: 🧪 Unit tests (контрольный вектор протокола обязателен)
        run: flutter test --coverage

      - name: 📤 Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: warn

  build-apk:
    name: 🤖 Build Android APK
    runs-on: ubuntu-latest
    needs: analyze-and-test
    timeout-minutes: 30
    steps:
      - name: 📚 Checkout
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 🐦 Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 📦 Pub get
        run: flutter pub get

      - name: 🔨 Build release APK
        run: flutter build apk --release

      - name: 🏷️ Prepare APK artifact
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/noctwave-app.apk

      - name: 📤 Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: noctwave-app-APK
          path: dist/noctwave-app.apk
          if-no-files-found: error

  build-ipa:
    name: 🍏 Build iOS Unsigned IPA
    runs-on: macos-latest
    needs: analyze-and-test
    timeout-minutes: 45
    steps:
      - name: 📚 Checkout
        uses: actions/checkout@v4

      - name: 🐦 Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 📦 Pub get
        run: flutter pub get

      # CODE_SIGNING_ALLOWED/REQUIRED=NO — сборка без сертификата (подход
      # референсного krasava-app); Flutter передаёт их в xcodebuild.
      - name: 🔨 Build iOS (release, no codesign)
        run: flutter build ios --release --no-codesign

      - name: 📦 Package unsigned IPA (Payload/Runner.app → zip)
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -R Runner.app Payload/
          zip -qry noctwave-app-unsigned.ipa Payload
          rm -rf Payload
          cd ../../..
          mv build/ios/iphoneos/noctwave-app-unsigned.ipa noctwave-app-unsigned.ipa

      - name: 📤 Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: noctwave-app-IPA
          path: noctwave-app-unsigned.ipa
          if-no-files-found: error

  release:
    name: 🚀 Publish GitHub Release (tag v*)
    runs-on: ubuntu-latest
    needs: [build-apk, build-ipa]
    if: startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 10
    steps:
      - name: 📥 Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: noctwave-app-APK
          path: dist

      - name: 📥 Download IPA artifact
        uses: actions/download-artifact@v4
        with:
          name: noctwave-app-IPA
          path: dist

      - name: 🚀 Create GitHub Release with APK + IPA
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "Noctwave App ${TAG}" \
            --generate-notes \
            dist/noctwave-app.apk \
            dist/noctwave-app-unsigned.ipa
